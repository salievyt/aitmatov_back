version: '3.9'

services:
  db:
    image: postgres:15-alpine
    container_name: aitmatov_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-aitmatov_db}
      POSTGRES_USER: ${DB_USER:-aitmatov_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aitmatov_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-aitmatov_user} -d ${DB_NAME:-aitmatov_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: aitmatov_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 aitmatov_digital.asgi:application"

  # Опционально: nginx для static/media в production
  nginx:
    image: nginx:alpine
    container_name: aitmatov_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - static_volume:/usr/share/nginx/html/static
      - media_volume:/usr/share/nginx/html/media
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

  redis:
    image: redis:7-alpine
    container_name: aitmatov_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  static_volume:
  media_volume:
  redis_data:
